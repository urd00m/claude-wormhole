display_information:
  name: Claude Agent
  description: A Slack-resident Claude Code agent — every thread is its own agent session.
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: Claude Agent
    always_online: true
  assistant_view:
    assistant_description: A Claude Code agent that lives in your Slack threads.
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - files:read
      - files:write
      - groups:history
      - im:history
      - im:read
      - im:write
      - mpim:history
      - reactions:read
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
